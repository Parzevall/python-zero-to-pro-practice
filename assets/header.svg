<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Python Zero to Pro: 400 questions, one foundation. 10 notebooks, 10 projects, 400 questions.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161f2c"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3fb950"/>
      <stop offset="27%"  stop-color="#7ee787"/>
      <stop offset="52%"  stop-color="#d29922"/>
      <stop offset="77%"  stop-color="#db6d28"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="5" height="300" fill="#58a6ff"/>

  <!-- headline: one text element, tspans flow naturally - no hardcoded offsets -->
  <text x="70" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
        font-size="16" letter-spacing="5.5" fill="#58a6ff">PYTHON · ZERO TO PRO</text>

  <text x="70" y="146" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#f0f6fc">400 questions.</text>
  <text x="70" y="204" font-family="Georgia,'Times New Roman',serif" font-size="54" font-weight="700" fill="#58a6ff">One foundation.</text>

  <text x="70" y="240" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="17" fill="#8b949e">Hidden hints · hidden solutions · every answer graded automatically</text>

  <!-- difficulty ramp -->
  <rect x="70" y="258" width="1060" height="6" rx="3" fill="url(#ramp)"/>
  <text x="70"   y="282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6e7681">L1  EXTREMELY EASY</text>
  <text x="1130" y="282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#6e7681" text-anchor="end">L5  HARD</text>

  <!-- stat card: fixed columns, every string sized to fit its column -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="896" y="52" width="244" height="116" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="916"  y="86" font-size="11" fill="#8b949e">questions</text>
    <text x="1000" y="86" font-size="11" fill="#8b949e">notebooks</text>
    <text x="1072" y="86" font-size="11" fill="#8b949e">projects</text>
    <text x="916"  y="120" font-size="27" font-weight="700" fill="#7ee787">400</text>
    <text x="1000" y="120" font-size="27" font-weight="700" fill="#d29922">10</text>
    <text x="1072" y="120" font-size="27" font-weight="700" fill="#db6d28">10</text>
    <line x1="916" y1="136" x2="1120" y2="136" stroke="#21262d" stroke-width="1"/>
    <text x="916" y="154" font-size="10.5" fill="#6e7681">every solution test-verified</text>
  </g>
</svg>

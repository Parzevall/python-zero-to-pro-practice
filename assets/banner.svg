  </g>
  <rect x="72" y="238" width="1056" height="7" rx="3.5" fill="url(#ramp)"/>

  <g transform="translate(940,92)" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="-18" y="-34" width="206" height="92" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <text x="0" y="-10" font-size="13" fill="#8b949e">notebooks</text>
    <text x="0" y="16" font-size="30" font-weight="700" fill="#7ee787">10</text>
    <text x="100" y="-10" font-size="13" fill="#8b949e">projects</text>
    <text x="100" y="16" font-size="30" font-weight="700" fill="#d29922">10</text>
    <text x="0" y="44" font-size="12" fill="#6e7681">467 tests · all solutions verified</text>

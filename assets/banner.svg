<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Python Zero to Pro — 400 practice questions, 10 notebooks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#15202b"/>
      <stop offset="100%" stop-color="#1b2735"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3fb950"/>
      <stop offset="28%"  stop-color="#7ee787"/>
      <stop offset="52%"  stop-color="#d29922"/>
      <stop offset="76%"  stop-color="#db6d28"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <g fill="#ffffff" opacity="0.022">
    <circle cx="1050" cy="60" r="150"/>
    <circle cx="140" cy="250" r="110"/>
  </g>

  <text x="72" y="104" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" letter-spacing="5" fill="#58a6ff">PYTHON · ZERO TO PRO</text>

  <text x="70" y="176" font-family="Georgia,'Times New Roman',serif" font-size="62" font-weight="700" fill="#f0f6fc">400 questions.</text>
  <text x="70" y="176" font-family="Georgia,'Times New Roman',serif" font-size="62" font-weight="700" fill="url(#accent)" dx="352">One foundation.</text>

  <text x="72" y="216" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#8b949e">Hidden hints · hidden solutions · every answer auto-graded</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#6e7681">
